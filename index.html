<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
    <title>Trabalho</title>
</head>

<body>
    <div class="header">
        Criador de crachá
    </div>
    <div class="content1">
        <div class="inputs">
            <label for="nome_completo">Nome Completo</label>
            <input type="text" name="" id="nome_completo" placeholder="Ex: Gabriel Pas Montoro Rufino">
            <label for="curso">Curso</label>
            <input type="text" name="" id="curso" placeholder="Ex: Informática 3A">
            <label for="data_nascimento">Data de Nascimento</label>
            <input type="date" name="" id="data_nascimento">
            <label for="telefone">Telefone</label>
            <input type="number" name="" id="telefone" placeholder="ex: 67999010638">
            <label for="fotosua">Foto</label>
            <input type="file" name="" id="fotosua">
            <button type="submit" id="btn">Enviar e Fazer</button>
        </div>
    </div>
    <div class="content2">
        <div class="outputs">
            <div class="cracha">Crachá criado:</div>
            <div id="base_cracha" >
                <div id="foto_out"></div>
                <div id="data_out"></div>
                <div id="tel_out"></div>
                <div id="curso_out"></div>
                <div id="nome_out"></div>
            </div>

        </div>
    </div>



    <script src="script.js"></script>
</body>

</html>
